# Dependabot baseline for a single-package npm/pnpm/yarn repo (package-ecosystem
# "npm" covers all three — Dependabot detects the lockfile itself). Two concerns,
# kept separate the same way python.yml does:
#
# - a `security-updates` group so every currently-fixable vulnerability alert
#   lands as ONE PR instead of one per CVE. Without this, Dependabot's default
#   is one alert -> one PR, which is how a repo ends up with 40+ open alerts
#   that nobody works through one at a time.
# - a `dependencies` group for routine version-update currency, same as
#   python.yml's weekly grouped bump.
#
# Adopt: cp to .github/dependabot.yml, adjust `directory` if package.json
# isn't at the repo root (see url-shortener's frontend/ layout).
#
# Grouping does not make an unfixable alert fixable — if a transitive pin
# blocks resolution (nanoid capped at 3.3.11 pending a parent package bump,
# for example), that alert still won't get a PR and needs a manual bump.
# Grouping only changes PR *count* for the alerts Dependabot can already fix.
#
# Two supply-chain defaults, both kept because automerge.yml merges every
# patch/minor version-update PR without a human (except github-actions bumps,
# which are SHA-pin updates reviewed by hand):
#
# - `cooldown: default-days: 7`: Dependabot proposes a version only once it
#   has been public for 7 days, so a hijacked release is usually caught and
#   yanked before it reaches an auto-merged PR. Security updates are never
#   delayed (cooldown applies to version updates only, per GitHub's docs).
# - `update-types: [minor, patch]` on the dependency group: a major lands as
#   its own PR instead of inside the group, so one breaking major (e.g. a
#   TypeScript release a lint plugin doesn't support yet) can't hold every
#   safe patch hostage, and majors stay out of auto-merge. Only on the
#   SemVer ecosystems; GitHub Actions and pre-commit get the cooldown alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
