# Copier template for the dev-standards baseline: every file init.py renders
# into a repo lives under templates/copier/, in the layout it lands in. Files
# ending in .jinja are rendered; the rest are copied verbatim. Each rendered
# repo records the template commit and these answers in .copier-answers.yml, so
# `copier update` can later bring template changes in (docs/template-sync.md).
_min_copier_version: "9.19.1"
_subdirectory: templates/copier
_templates_suffix: .jinja

# The release workflow is opt-in (libraries and distributed apps only). With
# _subdirectory set, Copier has no default excludes, so this is the whole list.
#
# CHANGELOG.md is rendered only on the first copy. _skip_if_exists alone is not
# enough: Copier skips such a file only when it exists, so `copier update` would
# add the placeholder to a repo that has no changelog. Excluded on update, it is
# in none of update's renders (the old commit's render uses these patterns too),
# so an update neither adds nor touches it.
_exclude:
  - "[% if not release %].github/workflows/release.yml[% endif %]"
  - "[% if _copier_operation == 'update' %]CHANGELOG.md[% endif %]"

# A repo's changelog is its own after the first render: init.py keeps an
# existing one even with --force (init.skip_if_exists_patterns reads this list).
_skip_if_exists:
  - CHANGELOG.md

# Jinja's default `{{ }}` collides with GitHub Actions' `${{ }}`, and `[[ ]]`
# with bash's `[[` in the CI job's script, so the template uses [= =] / [% %] /
# [# #]. tests/test_copier_template.py checks none of them appear in any
# verbatim (non-.jinja) file under templates/.
_envops:
  variable_start_string: "[="
  variable_end_string: "=]"
  block_start_string: "[%"
  block_end_string: "%]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

python_version:
  type: str
  help: Python version (lower bound of requires-python), e.g. 3.13
  default: "3.13"
  validator: "[% if not (python_version | regex_search('^3[.][0-9]+$')) %]Use the 3.X form[% endif %]"

dev_style:
  type: str
  help: Where the dev dependencies live
  choices:
    "[dependency-groups] dev (uv sync --dev)": groups
    "[project.optional-dependencies] dev (uv pip install -e .[dev])": optional
  default: groups

locked:
  type: bool
  help: Add --locked to uv sync
  default: false

include_tests:
  type: bool
  help: Include the pytest job (needs a tests/ dir and pytest as a dev dependency)
  default: true

branch:
  type: str
  help: Default branch CI runs on
  default: main

release:
  type: bool
  help: Add the tag-triggered release workflow (libraries and distributed apps only)
  default: false

# Computed, never asked or stored in .copier-answers.yml.
install_cmd:
  type: str
  when: false
  default: >-
    [%- if dev_style == 'optional' -%]
    uv venv && uv pip install -e ".[dev]"
    [%- elif locked -%]
    uv sync --locked --dev
    [%- else -%]
    uv sync --dev
    [%- endif -%]
