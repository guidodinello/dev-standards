# Baseline CI for a small/single-package Python repo — mirrors the pre-commit
# baseline (templates/pre-commit/python.yaml) as a required gate, since
# pre-commit itself only runs locally and CI is the only place a required
# check can actually enforce it. Deliberately just lint + test: no
# typecheck (add a "Typecheck Python" job with pyright/mypy once the repo
# has real type-annotation coverage), no path filtering (add
# dorny/paths-filter once this repo is a monorepo with independent
# subprojects — not needed for a single package).
#
# Adopt: cp to .github/workflows/ci.yml, fill in the two <FIXME> spots,
# then require ONLY the aggregate `CI` job below in the branch ruleset, pinned
# to the GitHub Actions app: {"context": "CI", "integration_id": 15368} in
# github-standard.json (integration_id stops another app from satisfying it).
# Per-job/per-matrix-leg contexts (e.g. "Tests (Python) (3.13)") silently stop
# gating when a job or matrix is renamed; `CI` is stable and fails if any job
# it needs failed or was cancelled, so a new job only needs adding to its
# `needs:` list.
#
# Every action is SHA-pinned (tag as a trailing comment) and checkout drops its
# credentials; the advisory zizmor job audits that. See docs/github-standard.md
# § Supply chain.
#
# Deliberately not in this baseline (add per repo if wanted): `uv sync
# --locked` (init.py --locked), and an actionlint job (docker:// needs Docker
# on the runner, which would turn a Docker-less self-hosted runner into a
# merge block — add it once the repo writes its own workflows).
#
# Before the first push, check the target repo actually has what this
# workflow assumes — two gaps found rolling this out the first time:
#   - `ruff`/`pytest` must be in the project's own dev dependency group.
#     A repo that only runs ruff through pre-commit's isolated hook env
#     doesn't have it on `uv sync --dev`'s PATH; CI fails with
#     "Failed to spawn: `ruff`" even though pre-commit works fine locally.
#   - ruff >=0.13 formats fenced Python code blocks inside Markdown by
#     default. `ruff format --check .` at a repo root with a docs/ folder
#     will try to reformat illustrative code snippets in prose. Add
#     `extend-exclude = ["docs"]` (or wherever non-source markdown lives)
#     under `[tool.ruff]` in pyproject.toml — fixes it for local
#     pre-commit and editors too, not just this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded pull_request runs are cancelled. Every other event (push to main,
# workflow_dispatch) gets a unique group, so it is never cancelled or replaced
# by a newer pending run -- GitHub drops a pending run in the same group even
# with cancel-in-progress false, which could leave a main commit with no CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default GITHUB_TOKEN scope for every job below — neither lints nor tests
# writes anything (no comments, no pushes, no packages). Least privilege.
permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Runner pool is switchable per repo without editing this file: set the
    # CI_RUNNERS repo variable to a JSON array of runner labels — e.g.
    # ["self-hosted","linux","x64"] — to route CI off GitHub-hosted runners
    # when their minutes are unavailable (on a private repo, exhausting the
    # free tier makes every job refuse to start). Unset means ubuntu-latest.
    # See dev-standards' README § CI runners for the commands.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

  # Advisory: audits the workflow files with zizmor. Not in the `CI` job's needs:
  # list and continue-on-error on the step, so findings never block a merge. The
  # version is pinned so a new upstream audit cannot turn this red between runs;
  # Dependabot does not bump a `uvx` pin, so bump it by hand. Make it blocking
  # (drop continue-on-error, add to needs:) once it has run clean for a few weeks.
  # GH_TOKEN is the read-only workflow token; it enables the online audits that
  # check each pinned SHA really belongs to the tagged repo.
  audit-workflows:
    name: Audit workflows (advisory)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: zizmor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github .github/workflows

  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  # Single stable check name for the branch ruleset (see header comment).
  # if: always() so it still runs (and fails) when a needed job fails; a
  # skipped required check would count as passing.
  ci:
    name: CI
    needs:
      - lint-python
      - test-python
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required job finished as: $r"
              exit 1
            fi
          done
